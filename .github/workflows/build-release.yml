name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - '1.0.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk endfield-weapon-filter-debug.apk

      # Releases are published only for version tags/branches, never for main
      - name: Create or Update GitHub Release
        if: github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            🤖 GitHub Actions による自動ビルドAPKです。
            コミット: ${{ github.sha }}
            ブランチ/タグ: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            endfield-weapon-filter-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Automatically Update Gist (update.json)
        if: success() && github.ref_name != 'main'
        continue-on-error: true
        run: |
          UPDATE_CONTENT=$(cat update.json)
          PAYLOAD=$(jq -n --arg content "$UPDATE_CONTENT" '{files: {"update.json": {content: $content}}}')
          curl -s -f -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_PAT || secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/gists/b65e2036929f618ca9799bfa7ec1d9c9 \
            -d "$PAYLOAD" || echo "Gist sync skipped or failed"
