name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - '1.0.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk endfield-weapon-filter-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (v1.0.3)"
          body: |
            🤖 GitHub Actions による自動ビルドAPKです。
            コミット: ${{ github.sha }}
            ブランチ: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            endfield-weapon-filter-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
